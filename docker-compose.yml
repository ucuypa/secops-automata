version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: secops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: secops_automata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: secops_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local